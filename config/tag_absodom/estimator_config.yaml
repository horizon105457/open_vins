%YAML:1.0

# tag-absodom example config — AprilTag-based absolute odometry
use_tag: true
tag_pos_publish_threshold: 0.01
tag_family: "36h11"
tag_size: 0.2
tag_config: "tag_config.yaml"
tag_info_accum_weight: 1.0

# Two-tier filtering thresholds
tag_min_edge_px: 20
tag_max_hamming: 2
tag_min_decision_margin: 0.5

# PnP noise / chi2
up_tag_sigma_pix: 1.0
up_tag_chi2_multipler: 1.0

# Standard OpenVINS settings (inherit defaults; override as needed)
use_fej: true
integration: "rk4"
max_clones: 11
max_slam: 25
max_msckf_in_update: 1000
